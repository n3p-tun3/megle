<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>megle</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <h1>megle</h1>
    </div>
    <div class="header-right">
      <div class="header-group">
        <span id="online-count" class="online-count">0 online</span>
        <div id="status" class="status" data-state="idle" role="status" aria-live="polite">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="status-text">Idle</span>
        </div>
      </div>
      <span class="header-divider" aria-hidden="true"></span>
      <div class="session">
        <span id="session-email"></span>
        <a href="/auth/logout" class="icon-btn" aria-label="Sign out" title="Sign out">
          <svg class="icon" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M120,216a8,8,0,0,1-8,8H48a8,8,0,0,1-8-8V40a8,8,0,0,1,8-8h64a8,8,0,0,1,0,16H56V208h56A8,8,0,0,1,120,216Zm109.66-93.66-40-40a8,8,0,0,0-11.32,11.32L204.69,120H112a8,8,0,0,0,0,16h92.69l-26.35,26.34a8,8,0,0,0,11.32,11.32l40-40A8,8,0,0,0,229.66,122.34Z"/></svg>
        </a>
      </div>
    </div>
  </header>

  <main class="app">
    <div class="stage">
      <div class="video-tile">
        <video id="local-video" autoplay playsinline muted></video>
        <span class="video-label">You</span>
        <span class="camera-off-label" hidden>Camera off</span>
        <div class="tile-controls">
          <button id="mic-btn" class="tile-btn" type="button" aria-pressed="false" aria-label="Mute microphone" title="Mute microphone">
            <svg class="icon" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M128,176a48.05,48.05,0,0,0,48-48V64a48,48,0,0,0-96,0v64A48.05,48.05,0,0,0,128,176ZM96,64a32,32,0,0,1,64,0v64a32,32,0,0,1-64,0Zm40,143.6V240a8,8,0,0,1-16,0V207.6A80.11,80.11,0,0,1,48,128a8,8,0,0,1,16,0,64,64,0,0,0,128,0,8,8,0,0,1,16,0A80.11,80.11,0,0,1,136,207.6Z"/></svg>
          </button>
          <button id="cam-btn" class="tile-btn" type="button" aria-pressed="false" aria-label="Turn camera off" title="Turn camera off">
            <svg class="icon" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M251.77,73a8,8,0,0,0-8.21.39L208,97.05V72a16,16,0,0,0-16-16H32A16,16,0,0,0,16,72V184a16,16,0,0,0,16,16H192a16,16,0,0,0,16-16V159l35.56,23.71A8,8,0,0,0,248,184a8,8,0,0,0,8-8V80A8,8,0,0,0,251.77,73ZM192,184H32V72H192V184Zm48-22.95-32-21.33V116.28L240,95Z"/></svg>
          </button>
        </div>
      </div>
      <div class="video-tile">
        <video id="remote-video" autoplay playsinline></video>
        <span class="video-label">Stranger</span>
        <button id="pip-btn" class="tile-btn tile-btn-corner" type="button" hidden aria-label="Pop out into a floating window" title="Pop out into a floating window">
          <svg class="icon" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M216,48H40A16,16,0,0,0,24,64V192a16,16,0,0,0,16,16H216a16,16,0,0,0,16-16V64A16,16,0,0,0,216,48ZM40,64H216v56H136a8,8,0,0,0-8,8v64H40ZM216,192H144V136h72v56Z"/></svg>
        </button>
      </div>
    </div>

    <div class="controls">
      <button id="start-btn" class="btn btn-primary">Start</button>
      <button id="next-btn" class="btn btn-secondary" disabled>Next</button>
      <button id="stop-btn" class="btn btn-ghost" disabled>Stop</button>
    </div>

    <section class="chat">
      <div id="chat-log" class="chat-log" role="log" aria-live="polite"></div>
      <p id="typing-indicator" class="typing-indicator" role="status" aria-live="polite" hidden>Stranger is typing...</p>
      <form id="chat-form" class="chat-form">
        <input
          id="chat-input"
          class="chat-input"
          type="text"
          maxlength="500"
          placeholder="Start a chat to send messages"
          autocomplete="off"
          aria-label="Message"
          disabled
        />
        <button id="chat-send" class="btn btn-primary btn-icon" type="submit" disabled aria-label="Send message" title="Send message">
          <svg class="icon" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M227.32,28.68a16,16,0,0,0-15.66-4.08l-.15,0L19.57,82.84a16,16,0,0,0-2.49,29.8L102,154l41.3,84.87A15.86,15.86,0,0,0,157.74,248q.69,0,1.38-.06a15.88,15.88,0,0,0,14-11.51l58.2-191.94c0-.05,0-.1,0-.15A16,16,0,0,0,227.32,28.68ZM157.83,231.85l-.05.14,0-.07-40.06-82.3,48-48a8,8,0,0,0-11.31-11.31l-48,48L24.08,98.25l-.07,0,.14,0L216,40Z"/></svg>
        </button>
      </form>
    </section>
  </main>

  <script src="client.js"></script>
</body>
</html>
