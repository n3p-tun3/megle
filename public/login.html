<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · meetastu</title>
  <link rel="stylesheet" href="style.css" />
  <script src="theme.js"></script>
</head>
<body class="onepager">
  <header>
    <div class="brand">
      <a href="/" class="brand-link"><h1>meetastu</h1></a>
    </div>
    <nav class="header-right" aria-label="Main">
      <a href="/rules" class="nav-link">Rules</a>
    </nav>
  </header>

  <main class="landing">
    <!-- Same static screen as the landing page, with the form tuned in on it. -->
    <section class="screen">
      <div class="screen-static" aria-hidden="true"></div>

      <div class="auth-card">
        <h2 class="auth-title">Sign in to meetastu</h2>
        <p class="auth-body">One tap with your Google account. No new password to remember.</p>

        <!-- Google draws its button in here; the min-height holds the space
             so the card doesn't jump when it arrives. -->
        <div id="google-btn" class="google-btn"></div>
        <p id="form-message" class="field-message" role="status" aria-live="polite"></p>

        <p id="in-app-tip" class="auth-tip" hidden>
          Google sign-in doesn't work inside app browsers like Telegram's or
          Instagram's. Open this page in <strong>Chrome</strong> or
          <strong>Safari</strong> instead.
        </p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>Your email is never shown to the people you meet.</p>
    <a href="/rules" class="nav-link">Community rules</a>
  </footer>

  <script src="https://accounts.google.com/gsi/client" async id="gsi-script"></script>
  <script src="login.js"></script>
  <script src="screen-static.js"></script>
</body>
</html>
