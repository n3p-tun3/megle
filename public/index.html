<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>megle</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>megle</h1>
    <div id="status" class="status" data-state="idle">
      <span class="status-dot"></span>
      <span id="status-text">Idle</span>
    </div>
  </header>

  <main>
    <div class="video-grid">
      <div class="video-tile">
        <video id="local-video" autoplay playsinline muted></video>
        <span class="video-label">You</span>
      </div>
      <div class="video-tile">
        <video id="remote-video" autoplay playsinline></video>
        <span class="video-label">Stranger</span>
      </div>
    </div>

    <div class="controls">
      <button id="start-btn" class="btn btn-primary">Start</button>
      <button id="next-btn" class="btn btn-secondary" disabled>Next</button>
      <button id="stop-btn" class="btn btn-ghost" disabled>Stop</button>
    </div>
  </main>

  <script src="client.js"></script>
</body>
</html>
