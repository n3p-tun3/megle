<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>meetastu</title>
  <meta name="description" content="Random one-on-one video chats with other ASTU students." />
  <link rel="stylesheet" href="style.css" />
  <script src="theme.js"></script>
</head>
<body class="onepager">
  <header>
    <div class="brand">
      <h1>meetastu</h1>
    </div>
    <nav class="header-right" aria-label="Main">
      <a href="/rules" class="nav-link">Rules</a>
    </nav>
  </header>

  <main class="landing">
    <!-- The hero is the app's own empty screen: static, waiting for someone. -->
    <section class="screen" aria-labelledby="hero-title">
      <div class="screen-static" aria-hidden="true"></div>
      <p id="online-now" class="screen-chip" hidden>
        <span class="online-dot" aria-hidden="true"></span>
        <span id="online-now-text"></span>
      </p>
      <div class="screen-copy">
        <h2 id="hero-title" class="hero-title">Bored? Talk to someone.</h2>
        <p id="hero-body" class="hero-body">Random video chats with other ASTU students.</p>
        <a href="/login" id="cta" class="btn btn-primary btn-lg">Open meetastu</a>
      </div>
    </section>

    <ol class="steps" aria-label="How it works">
      <li><span class="step-num" aria-hidden="true">1</span><span><strong>Sign in</strong> with Google, one tap</span></li>
      <li><span class="step-num" aria-hidden="true">2</span><span><strong>Press Start</strong> to meet a random student</span></li>
      <li><span class="step-num" aria-hidden="true">3</span><span><strong>Press Next</strong> whenever you want someone new</span></li>
    </ol>
  </main>

  <footer class="site-footer">
    <p>Independent student project, not affiliated with ASTU.</p>
    <a href="/rules" class="nav-link">Community rules</a>
  </footer>

  <script src="screen-static.js"></script>
  <script src="landing.js"></script>
</body>
</html>
