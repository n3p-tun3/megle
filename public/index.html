<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>megle</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>megle</h1>
    <div class="header-right">
      <span id="online-count" class="online-count">0 online</span>
      <div id="status" class="status" data-state="idle">
        <span class="status-dot"></span>
        <span id="status-text">Idle</span>
      </div>
      <div class="session">
        <span id="session-email"></span>
        <a href="/auth/logout">Sign out</a>
      </div>
    </div>
  </header>

  <main class="app">
    <div class="stage">
      <div class="video-tile">
        <video id="local-video" autoplay playsinline muted></video>
        <span class="video-label">You</span>
        <span class="camera-off-label" hidden>Camera off</span>
        <div class="tile-controls">
          <button id="mic-btn" class="tile-btn" type="button" aria-pressed="false" title="Mute microphone">Mic</button>
          <button id="cam-btn" class="tile-btn" type="button" aria-pressed="false" title="Turn camera off">Cam</button>
        </div>
      </div>
      <div class="video-tile">
        <video id="remote-video" autoplay playsinline></video>
        <span class="video-label">Stranger</span>
        <button id="pip-btn" class="tile-btn tile-btn-corner" type="button" hidden title="Pop out into a floating window">
          Pop out
        </button>
      </div>
    </div>

    <div class="controls">
      <button id="start-btn" class="btn btn-primary">Start</button>
      <button id="next-btn" class="btn btn-secondary" disabled>Next</button>
      <button id="stop-btn" class="btn btn-ghost" disabled>Stop</button>
    </div>

    <section class="chat">
      <div id="chat-log" class="chat-log" role="log" aria-live="polite"></div>
      <p id="typing-indicator" class="typing-indicator" hidden>Stranger is typing...</p>
      <form id="chat-form" class="chat-form">
        <input
          id="chat-input"
          class="chat-input"
          type="text"
          maxlength="500"
          placeholder="Start a chat to send messages"
          autocomplete="off"
          aria-label="Message"
          disabled
        />
        <button id="chat-send" class="btn btn-primary" type="submit" disabled>Send</button>
      </form>
    </section>
  </main>

  <script src="client.js"></script>
</body>
</html>
